<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>PicknPack — Hiring test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --tc:#6C5CE7; --ink:#1E1B4B; --dim:#6B6890; --line:#E7E4F5; --bg:#F4F2FC; --good:#1FB286; --bad:#EF5466; font-family:'Poppins',system-ui,-apple-system,Segoe UI,sans-serif; }
  *{box-sizing:border-box;} body{margin:0;background:radial-gradient(1200px 500px at 50% -120px, color-mix(in srgb, var(--tc) 18%, #fff), var(--bg));color:var(--ink);min-height:100vh;}
  header{display:flex;align-items:center;gap:12px;max-width:1000px;margin:0 auto;padding:18px 20px;}
  header img{height:38px;background:#2F2A7A;padding:6px 12px;border-radius:12px;} header b{font-size:15px;}
  main{max-width:1000px;margin:0 auto;padding:0 20px 40px;}
  .tp-card{background:#fff;border-radius:24px;padding:26px;box-shadow:0 30px 60px -34px rgba(30,27,75,.35);border:1px solid var(--line);position:relative;overflow:hidden;}
  .tp-tape{position:absolute;left:0;right:0;top:0;height:8px;background:var(--tc);}
  .tp-center{text-align:center;max-width:560px;margin:40px auto;}
  h1{margin:6px 0 6px;font-size:28px;line-height:1.2;} h2{margin:6px 0 10px;font-size:20px;}
  .tp-kicker{margin:0;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--tc);}
  .tp-muted{color:var(--dim);font-size:14px;line-height:1.6;} .tp-small{font-size:12.5px;}
  .tp-chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 18px;} .tp-chips span{background:var(--bg);border-radius:10px;padding:6px 12px;font-size:13px;font-weight:600;}
  .tp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px 16px;}
  label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;}
  input,select{border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;font:500 14.5px inherit;font-family:inherit;color:var(--ink);background:#fff;}
  input:focus,select:focus{outline:none;border-color:var(--tc);box-shadow:0 0 0 3px color-mix(in srgb, var(--tc) 18%, transparent);}
  .tp-rules{background:var(--bg);border-radius:16px;padding:14px 18px;margin:18px 0 6px;font-size:13.5px;} .tp-rules ul{margin:6px 0 0;padding-left:18px;color:var(--dim);line-height:1.7;}
  .tp-err{color:var(--bad);font-weight:600;font-size:13.5px;min-height:20px;}
  .tp-btn{border:none;background:var(--tc);color:#fff;border-radius:14px;padding:12px 22px;font:700 14.5px inherit;font-family:inherit;cursor:pointer;transition:transform .12s, box-shadow .12s;}
  .tp-btn:hover{transform:translateY(-1px);box-shadow:0 12px 22px -12px var(--tc);} .tp-btn:disabled{opacity:.45;cursor:default;transform:none;box-shadow:none;}
  .tp-btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);} .tp-link{background:none;border:none;color:var(--dim);font:600 13px inherit;font-family:inherit;cursor:pointer;text-decoration:underline;}
  .tp-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px 18px;margin-bottom:10px;position:sticky;top:10px;z-index:5;}
  .tp-timer{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--tc);} .tp-timer.low{color:var(--bad);animation:pulse 1s infinite;}
  @keyframes pulse{50%{opacity:.55}}
  .tp-progress{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:14px;} .tp-progress i{display:block;height:100%;background:var(--tc);transition:width .3s;}
  .tp-warn{background:#FFF4E5;color:#9A5B00;border-radius:14px;padding:10px 14px;margin-bottom:12px;font-size:13.5px;font-weight:600;}
  .tp-layout{display:grid;grid-template-columns:1fr 260px;gap:16px;align-items:start;}
  .tp-qtext{font-size:19px;line-height:1.5;font-weight:600;margin:10px 0 18px;white-space:pre-wrap;}
  .tp-opts{display:flex;flex-direction:column;gap:10px;}
  .tp-opt{display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:12px 14px;font:500 15px inherit;font-family:inherit;color:var(--ink);cursor:pointer;transition:border-color .12s, background .12s;}
  .tp-opt span{flex:0 0 34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--bg);font-weight:800;color:var(--dim);}
  .tp-opt:hover{border-color:var(--tc);} .tp-opt.on{border-color:var(--tc);background:color-mix(in srgb, var(--tc) 9%, #fff);} .tp-opt.on span{background:var(--tc);color:#fff;}
  .tp-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:20px;}
  .tp-side{position:sticky;top:84px;}
  .tp-pal{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0;}
  .tp-pal button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 0;font:700 13px inherit;font-family:inherit;color:var(--dim);cursor:pointer;}
  .tp-pal button.done{background:color-mix(in srgb, var(--tc) 14%, #fff);border-color:transparent;color:var(--ink);} .tp-pal button.cur{border-color:var(--tc);color:var(--tc);}
  .tp-side .tp-btn{width:100%;margin-top:6px;}
  .tp-modal{position:fixed;inset:0;background:rgba(30,27,75,.45);display:grid;place-items:center;padding:20px;z-index:50;} .tp-modal .tp-card{max-width:440px;width:100%;}
  .tp-ico{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;margin:0 auto 6px;font-size:30px;font-weight:800;color:#fff;} .tp-ico.good{background:var(--good);} .tp-ico.bad{background:var(--bad);}
  .tp-score{display:inline-flex;flex-direction:column;gap:2px;margin-top:12px;padding:14px 26px;border-radius:18px;} .tp-score b{font-size:30px;} .tp-score.pass{background:#E8F8F2;color:#117A5B;} .tp-score.fail{background:#FDECEF;color:#B4233B;}
  .tp-spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--tc);margin:0 auto 10px;animation:spin .8s linear infinite;} @keyframes spin{to{transform:rotate(360deg)}}
  @media (max-width:780px){ .tp-layout{grid-template-columns:1fr;} .tp-side{position:static;} .tp-card{padding:20px;border-radius:20px;} h1{font-size:23px;} .tp-qtext{font-size:17px;} }
</style>
</head>
<body>
<header><img src="assets/logo.png" alt="PicknPack" onerror="this.style.display='none'"><b>Hiring test</b></header>
<main id="tpMain"><div class="tp-card tp-center"><div class="tp-spin"></div><p class="tp-muted">Loading your test…</p></div></main>
<script src="js/config.js?v=20261001"></script>
<script src="js/testpage.js?v=20261001"></script>
</body>
</html>
